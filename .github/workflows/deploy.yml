name: Deploy MathLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Mark release certification pending before the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"mathlab-production\",\"description\":\"MathLab production release gate has started\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Release audit
        run: npm run audit:release

      - name: E12 certification audit
        run: npm run audit:e12

      - name: Stable release audit
        run: npm run audit:stable

      - name: Accessibility and device certification audit
        run: npm run audit:accessibility

      - name: Mathematical worksheet audit
        run: npm run audit:worksheet

      - name: Input and interaction audit
        run: npm run audit:input

      - name: Unified capability registry audit
        run: npm run audit:capabilities

      - name: Learning v2 audit
        run: npm run audit:learning

      - name: Dynamic exploration audit
        run: npm run audit:dynamic

      - name: Wirtschaftsmathematik audit
        run: npm run audit:wirtschaft

      - name: Sharing and collaboration audit
        run: npm run audit:sharing

      - name: Architecture stabilization audit
        run: npm run audit:architecture

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production bundle budget
        run: npm run audit:bundle

      - name: Install certified browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser stable and accessibility certification
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify live production
    runs-on: ubuntu-latest
    needs: deploy
    env:
      MATHLAB_PRODUCTION_URL: https://thiepn.dev/mathlab/
      PRODUCTION_STATUS_CONTEXT: mathlab-production

    steps:
      - name: Mark production verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"${PRODUCTION_STATUS_CONTEXT}\",\"description\":\"Live MathLab production verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Wait for custom-domain deployment
        run: node scripts/wait-for-production.mjs

      - name: Install production browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Live custom-domain verification
        run: npx playwright test --config=playwright.production.config.mjs

      - name: Mark production verification successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"${PRODUCTION_STATUS_CONTEXT}\",\"description\":\"Live MathLab production verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Mark production verification failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"${PRODUCTION_STATUS_CONTEXT}\",\"description\":\"Live MathLab production verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Upload production failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  finalize-production-status:
    name: Record final production certification status
    if: ${{ always() }}
    needs: [build, deploy, verify-production]
    runs-on: ubuntu-latest
    steps:
      - name: Publish success or failure for the entire release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-production.result }}
        run: |
          result=failure
          description="MathLab production gate failed or was skipped"
          if [ "$BUILD_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$VERIFY_RESULT" = success ]; then
            result=success
            description="MathLab live production certification passed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${result}\",\"context\":\"mathlab-production\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
