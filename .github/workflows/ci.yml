name: Check MathLab

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Release audit
        run: npm run audit:release

      - name: E12 certification audit
        run: npm run audit:e12

      - name: Stable release audit
        run: npm run audit:stable

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Dependency security gate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          rm package-lock.json

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install certified browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser stable release smoke
        run: npm run test:e2e
