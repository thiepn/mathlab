name: Check MathLab

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Release audit
        run: npm run audit:release

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
