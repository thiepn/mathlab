name: Check MathLab

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathlab-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Release audit
        run: npm run audit:release

      - name: E12 certification audit
        run: npm run audit:e12

      - name: Stable release audit
        run: npm run audit:stable

      - name: Accessibility and device certification audit
        run: npm run audit:accessibility

      - name: Mathematical worksheet audit
        run: npm run audit:worksheet

      - name: Input and interaction audit
        run: npm run audit:input

      - name: Unified capability registry audit
        run: npm run audit:capabilities

      - name: Learning v2 audit
        run: npm run audit:learning

      - name: Dynamic exploration audit
        run: npm run audit:dynamic

      - name: Wirtschaftsmathematik audit
        run: npm run audit:wirtschaft

      - name: Sharing and collaboration audit
        run: npm run audit:sharing

      - name: Architecture stabilization audit
        run: npm run audit:architecture

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Validate production verification harness
        run: |
          node --check playwright.production.config.mjs
          node --check scripts/wait-for-production.mjs
          npx playwright test --config=playwright.production.config.mjs --list

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production bundle budget
        run: npm run audit:bundle

      - name: Install certified browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser stable and accessibility certification
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stable-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  lockfile-forensic:
    # Temporary read-only generator: prints a deterministic npm lockfile
    # into this private Actions log for an exact, reviewable Git commit.
    # No workflow secrets or write permission; only public npm metadata.
    if: github.head_ref == 'investigation/live-indexeddb-reload-20261114'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Regenerate bounded patch-version lockfile
        run: |
          npm install --global --ignore-scripts npm@11.21.2
          npm --version
          npm install --package-lock-only --ignore-scripts --save-dev-exact vite@7.3.8 vitest@4.1.12
          node -e "const fs=require('fs');const lock=require('./package-lock.json');for(const [p,v] of [['node_modules/vite','7.3.8'],['node_modules/vitest','4.1.12'],['node_modules/@vitest/mocker','4.1.12']]){if(lock.packages[p]?.version!==v)throw Error('Unexpected '+p+': '+lock.packages[p]?.version)};const s=fs.readFileSync('package-lock.json','utf8');console.log('LOCKSTART '+s.length);for(let i=0;i<s.length;i+=5000)console.log('LOCKPART '+(i/5000)+' '+JSON.stringify(s.slice(i,i+5000)));console.log('LOCKEND '+s.length)"
      - name: Verify regenerated lockfile and advisories
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
