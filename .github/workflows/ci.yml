name: Check MathLab

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Release audit
        run: npm run audit:release

      - name: E12 certification audit
        run: npm run audit:e12

      - name: Stable release audit
        run: npm run audit:stable

      - name: Accessibility and device certification audit
        run: npm run audit:accessibility

      - name: Materialize dependency lockfile once
        if: github.event_name == 'pull_request' && hashFiles('package-lock.json') == ''
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Validate production verification harness
        run: |
          node --check playwright.production.config.mjs
          node --check scripts/wait-for-production.mjs
          npx playwright test --config=playwright.production.config.mjs --list

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install certified browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser stable and accessibility certification
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stable-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
