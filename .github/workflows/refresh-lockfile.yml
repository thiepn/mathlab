name: Refresh MathLab lockfile

on:
  push:
    branches:
      - p4-security-hotfix

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify high-severity security gate
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Security: refresh npm lockfile"
            git push
          fi
